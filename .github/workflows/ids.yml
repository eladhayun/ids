name: IDS CI/CD

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'hostapp/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.agents/**'
      - '.claude/**'
      - '.cursorrules'

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Install dependencies
        run: |
          go clean -modcache || true
          go mod download

      - name: Format code check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Please run 'go fmt ./...'"
            gofmt -s -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.6.2
          args: --timeout=5m

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html
        if: always()

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage.html
          retention-days: 30
        if: always()

      - name: Build application
        run: go build -o bin/server ./cmd/server

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.ACR_REGISTRY_NAME }}.azurecr.io/ids
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update-gitops:
    name: Update GitOps Repository
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Update image tag in deployment
        run: |
          cd gitops/ids
          IMAGE_TAG="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          sed -i "s|image: .*ids:.*|image: ${{ secrets.ACR_REGISTRY_NAME }}.azurecr.io/ids:${IMAGE_TAG}|g" deployment.yaml
          sed -i "s|image: .*ids:.*|image: ${{ secrets.ACR_REGISTRY_NAME }}.azurecr.io/ids:${IMAGE_TAG}|g" init-embeddings-cronjob.yaml
          
      - name: Commit and push changes
        run: |
          cd gitops
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update IDS image to ${GITHUB_SHA::7}" || echo "No changes to commit"
          git push

  notify-slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [test, build-and-push, update-gitops]
    if: ${{ always() }}
    steps:
      - name: Post workflow result
        continue-on-error: true
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          SLACK_CHANNEL: C09P9CPGAN9
        run: |
          if jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<<"$NEEDS_JSON" >/dev/null; then
            STATUS="failed"
            ICON=":x:"
          else
            STATUS="succeeded"
            ICON=":white_check_mark:"
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MSG="$ICON *${GITHUB_WORKFLOW}* ${STATUS} for \`${GITHUB_REPOSITORY}\` on \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}), triggered by ${GITHUB_ACTOR}: ${RUN_URL}"
          curl -fsSL -X POST https://slack-notifications.jshipster.io/notify \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg m "$MSG" --arg c "$SLACK_CHANNEL" '{message:$m, channel:$c}')"
